name: Quality Gate

on:
  push:
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-2025
    # The complete scene list is intentionally sequential. The physics
    # benchmark simulates several dozen seconds of gameplay in real time;
    # leave room for the full clean-checkout suite without weakening any
    # per-scene timeout or acceptance assertion.
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache pinned Godot binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/summit-sessions-godot-cache
          key: windows-godot-4.7.2-console-731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953

      - name: Download pinned Godot console binary
        shell: pwsh
        run: |
          $version = '4.7.2'
          $cacheRoot = Join-Path $env:RUNNER_TEMP 'summit-sessions-godot-cache'
          $archive = Join-Path $cacheRoot "Godot_v$version-stable_win64.exe.zip"
          $url = "https://github.com/godotengine/godot/releases/download/${version}-stable/Godot_v${version}-stable_win64.exe.zip"
          New-Item -ItemType Directory -Path $cacheRoot -Force | Out-Null
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            Invoke-WebRequest -Uri $url -OutFile $archive
          }
          # The release artifact is pinned by version and the checksum is
          # verified before it is executed. Update this value only alongside
          # an intentional Godot version change.
          $expectedSha256 = '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953'
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "Godot archive checksum is not pinned or does not match. Actual: $actualSha256"
          }
          $godotRoot = Join-Path $cacheRoot 'extracted'
          New-Item -ItemType Directory -Path $godotRoot -Force | Out-Null
          $godotExecutable = Get-ChildItem -LiteralPath $godotRoot -Filter '*console.exe' -Recurse -File | Select-Object -First 1
          if ($null -eq $godotExecutable) {
            Expand-Archive -LiteralPath $archive -DestinationPath $godotRoot -Force
            $godotExecutable = Get-ChildItem -LiteralPath $godotRoot -Filter '*console.exe' -Recurse -File | Select-Object -First 1
          }
          if ($null -eq $godotExecutable) {
            throw 'Pinned Godot archive did not contain a console executable.'
          }
          "GODOT_PATH=$($godotExecutable.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run static and runtime quality gate
        shell: pwsh
        run: |
          $userData = Join-Path $env:RUNNER_TEMP 'summit-sessions-godot-user'
          $logs = Join-Path $env:RUNNER_TEMP 'summit-sessions-runtime-logs'
          $captures = Join-Path $logs 'captures'
          & .\tests\quality_gate.ps1 -RepoRoot $PWD -GodotPath $env:GODOT_PATH -UserDataRoot $userData -LogDirectory $logs -CaptureDirectory $captures

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-quality-logs
          path: ${{ runner.temp }}/summit-sessions-runtime-logs
          if-no-files-found: warn
