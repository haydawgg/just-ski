name: Quality Gate

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  # Push and pull_request events for the same branch share a group, so an
  # equivalent duplicate run cannot consume another full Windows matrix.
  group: quality-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_ARCHIVE_SHA256: "731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953"

jobs:
  static:
    name: static
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run static quality gate
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          & .\tests\static_quality_gate.ps1 -RepoRoot $PWD

  prepare_runtime:
    name: prepare-runtime
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          archive-sha256: ${{ env.GODOT_ARCHIVE_SHA256 }}

      - name: Cache project import state
        uses: actions/cache@v4
        with:
          # Imported assets alone are not enough for a clean GDScript boot:
          # Godot also needs the generated class and UID registries to resolve
          # project-level class_name declarations in every shard.
          path: |
            .godot/imported
            .godot/global_script_class_cache.cfg
            .godot/uid_cache.bin
          key: windows-godot-${{ env.GODOT_VERSION }}-imported-v2-${{ hashFiles('project.godot', '**/*.gd', '**/*.tscn', '**/*.tres', '**/*.res', '**/*.svg', '**/*.png', '**/*.jpg', '**/*.jpeg', '**/*.webp', '**/*.glb', '**/*.gltf', '**/*.obj', '**/*.mtl', '**/*.ogg', '**/*.wav') }}
          restore-keys: |
            windows-godot-${{ env.GODOT_VERSION }}-imported-v2-

      - name: Import project assets
        shell: pwsh
        run: |
          $userData = Join-Path $env:RUNNER_TEMP 'summit-sessions-godot-user-prepare'
          $roaming = Join-Path $userData 'roaming'
          $local = Join-Path $userData 'local'
          New-Item -ItemType Directory -Path $roaming -Force | Out-Null
          New-Item -ItemType Directory -Path $local -Force | Out-Null
          $env:APPDATA = (Resolve-Path $roaming).Path
          $env:LOCALAPPDATA = (Resolve-Path $local).Path
          & $env:GODOT_PATH --headless --audio-driver Dummy --editor --quit --path $PWD
          if ($LASTEXITCODE -ne 0) {
            throw "Godot project import failed with exit code $LASTEXITCODE"
          }

  runtime:
    name: runtime-${{ matrix.shard }}
    needs: prepare_runtime
    if: ${{ needs.prepare_runtime.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - environment-camera
          - physics
          - animation
          - tricks-gameplay
          - systems-media
    env:
      RUNTIME_SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          archive-sha256: ${{ env.GODOT_ARCHIVE_SHA256 }}

      - name: Restore project import state
        uses: actions/cache@v4
        with:
          path: |
            .godot/imported
            .godot/global_script_class_cache.cfg
            .godot/uid_cache.bin
          key: windows-godot-${{ env.GODOT_VERSION }}-imported-v2-${{ hashFiles('project.godot', '**/*.gd', '**/*.tscn', '**/*.tres', '**/*.res', '**/*.svg', '**/*.png', '**/*.jpg', '**/*.jpeg', '**/*.webp', '**/*.glb', '**/*.gltf', '**/*.obj', '**/*.mtl', '**/*.ogg', '**/*.wav') }}
          restore-keys: |
            windows-godot-${{ env.GODOT_VERSION }}-imported-v2-

      - name: Run runtime shard
        shell: pwsh
        run: |
          $userData = Join-Path $env:RUNNER_TEMP ("summit-sessions-godot-user-" + $env:RUNTIME_SHARD)
          $logs = Join-Path $env:RUNNER_TEMP ("summit-sessions-runtime-logs-" + $env:RUNTIME_SHARD)
          $captures = Join-Path $logs 'captures'
          & .\tests\runtime_quality_gate.ps1 -RepoRoot $PWD -GodotPath $env:GODOT_PATH -UserDataRoot $userData -LogDirectory $logs -CaptureDirectory $captures -Shard $env:RUNTIME_SHARD -TimeoutMilliseconds 120000
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-quality-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/summit-sessions-runtime-logs-${{ matrix.shard }}
          if-no-files-found: warn

  export_pack:
    name: export-pack-smoke
    needs: prepare_runtime
    if: ${{ needs.prepare_runtime.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          archive-sha256: ${{ env.GODOT_ARCHIVE_SHA256 }}

      - name: Restore project import state
        uses: actions/cache@v4
        with:
          path: |
            .godot/imported
            .godot/global_script_class_cache.cfg
            .godot/uid_cache.bin
          key: windows-godot-${{ env.GODOT_VERSION }}-imported-v2-${{ hashFiles('project.godot', '**/*.gd', '**/*.tscn', '**/*.tres', '**/*.res', '**/*.svg', '**/*.png', '**/*.jpg', '**/*.jpeg', '**/*.webp', '**/*.glb', '**/*.gltf', '**/*.obj', '**/*.mtl', '**/*.ogg', '**/*.wav') }}
          restore-keys: |
            windows-godot-${{ env.GODOT_VERSION }}-imported-v2-

      - name: Export production PCK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path builds\windows -Force | Out-Null
          $exportLog = Join-Path $env:RUNNER_TEMP 'summit-sessions-export-pack.log'
          & $env:GODOT_PATH --headless --verbose --audio-driver Dummy --path $PWD --export-pack "Windows Desktop" builds\windows\SummitSessions.pck *> $exportLog
          $exitCode = $LASTEXITCODE
          $exportOutput = Get-Content -Raw -LiteralPath $exportLog
          Write-Output $exportOutput
          $errorPattern = '(?im)^\s*(?:SHADER ERROR|SCRIPT ERROR|ERROR:)|\b[A-Z_]+_FAIL:|Parameter "t" is null|leaked texture|RIDs of type "Texture" were leaked|Texture.*leaked|ObjectDB instances were leaked|texture-RID'
          if ($exitCode -ne 0 -or $exportOutput -match $errorPattern) {
            throw "Godot production pack export failed or emitted an engine/script error (exit $exitCode)"
          }
          if ($exportOutput -match '(?im)Storing File:\s+res://(?:tests|tools)/') {
            throw 'Production pack included a tests/ or tools/ resource.'
          }
          $pack = Get-Item -LiteralPath builds\windows\SummitSessions.pck
          if ($pack.Length -le 0) {
            throw 'Exported production pack is empty.'
          }
          Write-Output ("EXPORT_PACK_BYTES={0}" -f $pack.Length)

      - name: Smoke-test exported PCK
        shell: pwsh
        run: |
          $userData = Join-Path $env:RUNNER_TEMP 'summit-sessions-export-pack-user'
          $roaming = Join-Path $userData 'roaming'
          $local = Join-Path $userData 'local'
          New-Item -ItemType Directory -Path $roaming -Force | Out-Null
          New-Item -ItemType Directory -Path $local -Force | Out-Null
          $env:APPDATA = (Resolve-Path $roaming).Path
          $env:LOCALAPPDATA = (Resolve-Path $local).Path
          $smokeLog = Join-Path $env:RUNNER_TEMP 'summit-sessions-export-pack-smoke.log'
          & $env:GODOT_PATH --headless --audio-driver Dummy --main-pack builds\windows\SummitSessions.pck --quit-after 120 *> $smokeLog
          $exitCode = $LASTEXITCODE
          $smokeOutput = Get-Content -Raw -LiteralPath $smokeLog
          Write-Output $smokeOutput
          $errorPattern = '(?im)^\s*(?:SHADER ERROR|SCRIPT ERROR|ERROR:)|\b[A-Z_]+_FAIL:|Parameter "t" is null|leaked texture|RIDs of type "Texture" were leaked|Texture.*leaked|ObjectDB instances were leaked|texture-RID'
          if ($exitCode -ne 0 -or $smokeOutput -match $errorPattern) {
            throw "Exported production pack smoke test failed or emitted an engine/script error (exit $exitCode)"
          }

      - name: Upload export pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-production-pack
          path: builds/windows/SummitSessions.pck
          if-no-files-found: error

  quality:
    name: quality
    needs:
      - static
      - prepare_runtime
      - runtime
      - export_pack
    if: ${{ always() }}
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Verify all quality jobs passed
        shell: pwsh
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          PREPARE_RESULT: ${{ needs.prepare_runtime.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          EXPORT_PACK_RESULT: ${{ needs.export_pack.result }}
        run: |
          Write-Output "static=$env:STATIC_RESULT prepare-runtime=$env:PREPARE_RESULT runtime=$env:RUNTIME_RESULT export-pack=$env:EXPORT_PACK_RESULT"
          if ($env:STATIC_RESULT -ne 'success' -or $env:PREPARE_RESULT -ne 'success' -or $env:RUNTIME_RESULT -ne 'success' -or $env:EXPORT_PACK_RESULT -ne 'success') {
            throw 'One or more required static/runtime/export quality jobs did not pass.'
          }
          Write-Output 'QUALITY_GATE_PASS: static checks, production pack export, and all five runtime shards passed.'